# Nested sway for greeter iteration. Run from the repo root:
#   sway -c pkgs/qs-greeter/dev/sway-nested.conf
# Nested sway, NOT nested Hyprland: the nested-Hyprland path has known hazards
# (stranded session locks, WAYLAND_DISPLAY clobbering the outer session).
#
# The QSG_DEFAULTS / QSG_USER_FILE / QSG_SESSIONS fixtures below are not
# checked in -- create them under pkgs/qs-greeter/dev/ before running this
# (defaults.json needs at least the shape SettingsMerge.js expects; see
# dev/tests/settings-load.sh for a working defaults.json; sessions.json is a
# JSON array of {name, argv, env}, matching what sessions-parse.sh emits).
output * bg #202020 solid_color
exec sh -c 'QSG_DEFAULTS=$PWD/pkgs/qs-greeter/dev/defaults.json \
  QSG_USER_FILE=$PWD/pkgs/qs-greeter/dev/user-settings.json \
  QSG_SESSIONS=$PWD/pkgs/qs-greeter/dev/sessions.json \
  qs -p $PWD/pkgs/qs-greeter/greeter'
bindsym Mod4+shift+q exit
